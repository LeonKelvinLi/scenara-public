name: Application checks

on: workflow_dispatch

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: scenara_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scenara-backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: scenara-backend
      - run: python -m unittest discover -s tests -v
        working-directory: scenara-backend
        env:
          SCENARA_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/scenara_test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scenara-mobile/package-lock.json
      - run: npm ci
        working-directory: scenara-mobile
      - run: npm run typecheck && npm run test:locales && npm run lint && npm run build
        working-directory: scenara-mobile
        env:
          EXPO_PUBLIC_API_URL: /api/backend
          EXPO_PUBLIC_PROJECT_PAUSED: 'false'
